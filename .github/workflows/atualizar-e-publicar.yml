name: Atualizar dados e publicar painel

on:
  schedule:
    - cron: "17 10 * * 1"   # toda segunda-feira, 07:17 em Teresina (10:17 UTC)
  workflow_dispatch:         # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths: ["docs/**"]       # republica quando o painel muda

permissions:
  contents: write            # para salvar os dados atualizados no repositório
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Coletar e processar dados
        if: github.event_name != 'push'
        run: |
          pip install -r requirements.txt
          python scripts/coletar.py
          python scripts/processar.py
          python scripts/gerar_site.py

      - name: Salvar dados atualizados no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Atualiza dados do Obrasgov ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
